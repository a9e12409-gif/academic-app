<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F6FA" />
    <meta name="description" content="مساحة دراسية خفيفة لتنظيم يومك الجامعي — مواعيدك وملفاتك وامتحاناتك على جهازك." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>جدولي الجامعي</title>
    <script>
      // Pre-paint theme bootstrap — يمنع وميض الوضع الخطأ قبل تحميل React
      (function () {
        try {
          var t = localStorage.getItem("academic-metro-hub:theme");
          if (t === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0E1117");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
